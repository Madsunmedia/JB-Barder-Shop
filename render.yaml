databases:
  - name: jb-barbershop-db
    databaseName: jb_barbershop
    user: jb_admin
    plan: free # The database plan (free, starter, standard, etc.)

services:
  - type: web
    name: jb-barbershop-web
    env: node
    plan: free # Note: Free plans spin down after 15 mins of inactivity
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jb-barbershop-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false # Set this in your Render dashboard (e.g. your .onrender.com domain)
      - key: NEXTAUTH_SECRET
        generateValue: true # Render will automatically generate a secure secret
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set value in Render dashboard: root
      - key: CLOUDINARY_API_KEY
        sync: false # Set value in Render dashboard: 712258522452469
      - key: CLOUDINARY_API_SECRET
        sync: false # Set value in Render dashboard: HHbXzejyftortSuIszLtwgdOlC8
